services:
  postgres:
    image: postgres:16-alpine
    container_name: gabby-postgres
    environment:
      POSTGRES_USER: gabby
      POSTGRES_PASSWORD: gabbypass
      POSTGRES_DB: gabby
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gabby -d gabby"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=postgresql://gabby:gabbypass@postgres:5432/gabby
    container_name: gabby-bot
    environment:
      - BOT_CREATOR_ID=${BOT_CREATOR_ID}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PORT=${PORT}
      - DATABASE_URL=postgresql://gabby:gabbypass@postgres:5432/gabby?connect_timeout=300
      - PRISMA_CONNECTION_TYPE=adapter
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./cache:/app/cache
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
